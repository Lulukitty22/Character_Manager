ion":"This character is wired to demonstrate shortbow shots consuming arrows and arrow bundles restoring the ammo resource.","collection":"traits","updatedAt":"2026-05-09T08:03:11.344Z"},{"schemaVersion":1,"id":"traits.08f36953-b9aa-4c81-aa37-78dbb191585d","name":"Arcane Mastery","collections":["traits"],"tags":["magic"],"variantOf":null,"sourceReferences":[],"features":{"trait":{},"rulesText":{"description":"Adds +2 to spell save DCs and spell/flesh attack rolls."}},"desc":"Adds +2 to spell save DCs and spell/flesh attack rolls."},{"schemaVersion":1,"id":"traits.05dd66db-ddc3-493d-a4b7-b446d2736e30","name":"Bonus Attack","collections":["traits"],"tags":["combat"],"variantOf":null,"sourceReferences":[],"features":{"trait":{},"rulesText":{"description":"If Capella takes the Attack action on her turn, she may make 1 additional natural attack as a Bonus Action."}},"desc":"If Capella takes the Attack action on her turn, she may make 1 additional natural attack as a Bonus Action."},{"schemaVersion":1,"id":"traits.capella-trait-boss-presence","name":"Boss Presence","collections":["traits"],"tags":["capella","boss","state"],"variantOf":null,"sourceReferences":[{"provider":"internal","sourceId":"capella-trait-boss-presence","url":"https://dnd-5e.fandom.com/wiki/Statistics","note":"Legendary Creatures"}],"features":{"trait":{},"rulesText":{"description":"Temporary enemy-boss overlay. Adds STR +6, DEX +5, CON +8, INT +1, WIS +9, and CHA +10, swaps to the boss HP pool, grants encounter pressure, and is removed when she is tamed, pacified, recruited, purified, or weakened out of boss status."}},"desc":"Temporary enemy-boss overlay. Adds STR +6, DEX +5, CON +8, INT +1, WIS +9, and CHA +10, swaps to the boss HP pool, grants encounter pressure, and is removed when she is tamed, pacified, recruited, purified, or weakened out of boss status."},{"schemaVersion":1,"id":"traits.open5e-traits-srd-abilities-charisma","name":"Charisma","collections":["traits"],"tags":["open5eapi","srd"],"variantOf":null,"sourceReferences":[{"provider":"open5eapi","sourceId":"srd_abilities_charisma","url":"https://api.open5e.com/v2/rules/srd_abilities_charisma/","note":"System Reference Document 5.1"}],"features":{"trait":{},"rulesText":{"description":"Charisma measures your ability to interact effectively with others. It includes such factors as confidence and eloquence, and it can represent a charming or commanding personality.\n\n## Charisma Checks\n\nA Charisma check might arise when you try to influence or entertain others, when you try to make an impression or tell a convincing lie, or when you are navigating a tricky social situation. The Deception, Intimidation, Performance, and Persuasion skills reflect aptitude in certain kinds of Charisma checks.\n\n### Deception\n\nYour Charisma (Deception) check determines whether you can convincingly hide the truth, either verbally or through your actions. This deception can encompass everything from misleading others through ambiguity to telling outright lies. Typical situations include trying to fast-talk a guard, con a merchant, earn money through gambling, pass yourself off in a disguise, dull someone's suspicions with false assurances, or maintain a straight face while telling a blatant lie.\n\n### Intimidation  \nWhen you attempt to influence someone through overt threats, hostile actions, and physical violence, the GM might ask you to make a Charisma (Intimidation) check. Examples include trying to pry information out of a prisoner, convincing street thugs to back down from a confrontation, or using the edge of a broken bottle to convince a sneering vizier to reconsider a decision.\n\n### Performance  \nYour Charisma (Performance) check determines how well you can delight an audience with music, dance, acting, storytelling, or some other form of entertainment.\n\n### Persuasion  \nWhen you attempt to influence someone or a group of people with tact, social graces, or good nature, the GM might ask you to make a Charisma (Persuasion) check. Typically, you use persuasion when acting in good faith, to foster friendships, make cordial requests, or exhibit proper etiquette. Examples of persuading others include convincing a chamberlain to let your party see the king, negotiating peace between warring tribes, or inspiring a crowd of townsfolk\n\n### Other Charisma Checks\n\nThe GM might call for a Charisma check when you try to accomplish tasks like the following:\n\n- Find the best person to talk to for news, rumors, and gossip\n- Blend into a crowd to get the sense of key topics of conversation\n\n\n## Spellcasting Ability\n\nBards, paladins, sorcerers, and warlocks use Charisma as their spellcasting ability, which helps determine the saving throw DCs of spells they cast."}},"desc":"Charisma measures your ability to interact effectively with others. It includes such factors as confidence and eloquence, and it can represent a charming or commanding personality.\n\n## Charisma Checks\n\nA Charisma check might arise when you try to influence or entertain others, when you try to make an impression or tell a convincing lie, or when you are navigating a tricky social situation. The Deception, Intimidation, Performance, and Persuasion skills reflect aptitude in certain kinds of Charisma checks.\n\n### Deception\n\nYour Charisma (Deception) check determines whether you can convincingly hide the truth, either verbally or through your actions. This deception can encompass everything from misleading others through ambiguity to telling outright lies. Typical situations include trying to fast-talk a guard, con a merchant, earn money through gambling, pass yourself off in a disguise, dull someone's suspicions with false assurances, or maintain a straight face while telling a blatant lie.\n\n### Intimidation  \nWhen you attempt to influence someone through overt threats, hostile actions, and physical violence, the GM might ask you to make a Charisma (Intimidation) check. Examples include trying to pry information out of a prisoner, convincing street thugs to back down from a confrontation, or using the edge of a broken bottle to convince a sneering vizier to reconsider a decision.\n\n### Performance  \nYour Charisma (Performance) check determines how well you can delight an audience with music, dance, acting, storytelling, or some other form of entertainment.\n\n### Persuasion  \nWhen you attempt to influence someone or a group of people with tact, social graces, or good nature, the GM might ask you to make a Charisma (Persuasion) check. Typically, you use persuasion when acting in good faith, to foster friendships, make cordial requests, or exhibit proper etiquette. Examples of persuading others include convincing a chamberlain to let your party see the king, negotiating peace between warring tribes, or inspiring a crowd of townsfolk\n\n### Other Charisma Checks\n\nThe GM might call for a Charisma check when you try to accomplish tasks like the following:\n\n- Find the best person to talk to for news, rumors, and gossip\n- Blend into a crowd to get the sense of key topics of conversation\n\n\n## Spellcasting Ability\n\nBards, paladins, sorcerers, and warlocks use Charisma as their spellcasting ability, which helps determine the saving throw DCs of spells they cast."},{"schemaVersion":1,"id":"traits.69a33466-f911-4440-907d-bd020e7f0b77","name":"Charisma Spellcasting","collections":["traits"],"tags":["spellcasting"],"variantOf":null,"sourceReferences":[{"provider":"internal","sourceId":"69a33466-f911-4440-907d-bd020e7f0b77","url":"https://api.open5e.com/v2/rules/srd_abilities_charisma/","note":"System Reference Document 5.1"}],"features":{"trait":{},"rulesText":{"description":"Capella uses Charisma for spell save DCs, spell attacks, flesh magic, Polymorph effects, and distortion effects."}},"desc":"Capella uses Charisma for spell save DCs, spell attacks, flesh magic, Polymorph effects, and distortion effects."},{"schemaVersion":1,"id":"traits.dnd5eapi-fea
